    <script>
      // Gracefully handle cross-origin third-party script errors (such as Disqus in sandboxed iframes or adblockers)
      window.addEventListener('error', function(event) {
        if (
          event.message === 'Script error.' ||
          (event.filename && event.filename.includes('disqus')) ||
          (event.error && String(event.error).includes('disqus'))
        ) {
          event.preventDefault();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && String(event.reason).includes('disqus')) {
          event.preventDefault();
        }
      });
    </script>
